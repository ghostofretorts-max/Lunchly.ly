/* ============================================================
   ICON — renders Lucide icons via the UMD build
   ============================================================ */
function Icon({ name, size = 20, strokeWidth = 1.5, className = "" }) {
  const hostRef = useRef(null);

  useEffect(() => {
    const host = hostRef.current;
    if (!host || !window.lucide || !window.lucide.icons) return;

    const node = window.lucide.icons[name];
    if (!node) return;

    host.innerHTML = "";

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("xmlns", NS);
    svg.setAttribute("width", String(size));
    svg.setAttribute("height", String(size));
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", String(strokeWidth));
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");

    const paint = (arr, parent) => {
      if (!Array.isArray(arr)) return;
      arr.forEach((item) => {
        if (!Array.isArray(item) || typeof item[0] !== "string") return;
        const [tag, attrs, kids] = item;
        const el = document.createElementNS(NS, tag);
        if (attrs && typeof attrs === "object") {
          Object.keys(attrs).forEach((k) => {
            if (attrs[k] !== undefined && attrs[k] !== null) {
              el.setAttribute(k, String(attrs[k]));
            }
          });
        }
        if (Array.isArray(kids)) paint(kids, el);
        parent.appendChild(el);
      });
    };

    paint(Array.isArray(node) ? node : node.children, svg);
    host.appendChild(svg);
  }, [name, size, strokeWidth]);

  return (
    <span
      ref={hostRef}
      aria-hidden="true"
      className={"inline-flex shrink-0 items-center justify-center " + className}
    />
  );
}

/* ============================================================
   REVEAL — scroll-triggered entrance
   ============================================================ */
function Reveal({ children, delay = 0, className = "", as: Tag = "div", ...rest }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) {
      setVisible(true);
      return;
    }

    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          observer.disconnect();
        }
      },
      { threshold: 0.08, rootMargin: "0px 0px -60px 0px" }
    );

    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  return (
    <Tag
      ref={ref}
      style={{ transitionDelay: delay ? `${delay}ms` : undefined }}
      className={`reveal ${visible ? "is-visible" : ""} ${className}`}
      {...rest}
    >
      {children}
    </Tag>
  );
}

function Eyebrow({ children, tone = "dark", className = "" }) {
  const color = tone === "light" ? "text-bronze-soft" : "text-bronze";
  return (
    <div className={"flex items-center gap-3 " + className}>
      <span className={"h-px w-8 " + (tone === "light" ? "bg-bronze-soft/70" : "bg-bronze/60")} />
      <span className={"text-[12px] font-medium " + color}>{children}</span>
    </div>
  );
}

function PrimaryButton({ children, href = "#", icon, className = "", onClick, type = "button", as = "a" }) {

    "group inline-flex items-center justify-center gap-2.5 rounded-full bg-ink px-7 py-3.5 text-[14px] font-medium text-cream " +

    "shadow-[0_10px_30px_-14px_rgba(25,24,20,0.6)] hover:shadow-[0_14px_34px_-12px_rgba(160,124,74,0.6)] " +
    className;

  const inner = (
    <>
      <span>{children}</span>
      {icon && (
        <Icon
          name={icon}
          size={16}
          className="transition-transform duration-400 group-hover:-translate-x-1"
        />
      )}
    </>
  );

  if (as === "button") {
    return <button type={type} onClick={onClick} className={cls}>{inner}</button>;
  }
  return <a href={href} onClick={onClick} className={cls}>{inner}</a>;
}

function GhostButton({ children, href = "#", icon, tone = "dark", className = "", onClick }) {

    light: "border border-white/35 text-white hover:bg-white hover:text-ink hover:border-white",

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [filters, setFilters] = useState({ city: "", type: "", price: "" });
  const [applied, setApplied] = useState({ city: "", type: "", price: "" });

  const filtered = useMemo(() => {
    return PROPERTIES.filter((p) => {
      if (applied.city && p.city !== applied.city) return false;
      if (applied.type && p.type !== applied.type) return false;
      if (applied.price === "low" && p.price >= 1000000) return false;
      if (applied.price === "mid" && (p.price < 1000000 || p.price > 2000000)) return false;
      if (applied.price === "high" && p.price <= 2000000) return false;
      return true;
    });
  }, [applied]);

  const isFiltered = Boolean(applied.city || applied.type || applied.price);

  const handleSearch = useCallback(() => {
    setApplied(filters);
    const el = document.getElementById("properties");
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top, behavior: "smooth" });
    }
  }, [filters]);

  const handleReset = useCallback(() => {
    setFilters({ city: "", type: "", price: "" });
    setApplied({ city: "", type: "", price: "" });
  }, []);

  return (
    <div className="page-enter min-h-screen bg-cream font-sans antialiased">
      <a
        href="#properties"
        className="sr-only focus:not-sr-only focus:fixed focus:right-6 focus:top-6 focus:z-[100] focus:rounded-full focus:bg-ink focus:px-5 focus:py-3 focus:text-[13px] focus:text-cream"
      >
        تخطَّ إلى المحتوى الرئيسي
      </a>

      <Nav />

      <main>
        <Hero />

        <SearchPanel
          filters={filters}
          setFilters={setFilters}
          onSearch={handleSearch}
          resultCount={filtered.length}
          active={isFiltered}
        />

        <FeaturedProperties
          properties={filtered}
          filtered={isFiltered}
          onReset={handleReset}
        />

        <WhyNova />
        <About />
        <Services />
        <Testimonials />
        <FinalCTA />
      </main>

      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
